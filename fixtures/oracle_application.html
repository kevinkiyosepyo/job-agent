<html>
  <body>
    <h1>Software Engineer Intern</h1>
    <div class="job-location">United States</div>

    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required value="Kevin" />

    <label for="country">Country</label>
    <div data-field-type="combobox" data-name="country" data-required="true" data-value="United States">
      <button id="country">United States</button>
      <ul>
        <li>Canada</li>
        <li>United States</li>
      </ul>
    </div>

    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" required data-uploaded-filename="Kevin_Pyo_Resume.pdf" />

    <label for="salary">Salary Expectation</label>
    <div data-field-type="combobox" data-name="salary" data-required="true" data-value="Open to discuss">
      <button id="salary">Open to discuss</button>
      <ul>
        <li>$20/hour</li>
        <li>Open to discuss</li>
      </ul>
    </div>
  </body>
</html>
