<!DOCTYPE html>
<html lang="en">
  <body>
    <main>
      <h1>Data Scientist Intern</h1>
      <div class="posting-categories">
        <span class="sort-by-location">San Diego, CA</span>
      </div>
      <form id="application-form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" required value="Kevin Kiyose Pyo" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="kevinkpyo@gmail.com" />

        <label for="resume">Resume/CV</label>
        <input id="resume" name="resume" type="file" required data-uploaded-filename="Kevin_Pyo_Resume.pdf" />
        <div class="resume-upload">Kevin_Pyo_Resume.pdf</div>

        <label for="linkedin">LinkedIn</label>
        <input id="linkedin" name="urls[LinkedIn]" type="url" value="https://linkedin.com/in/kevin-pyo" />

        <button type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
